openapi: 3.1.0
info:
  version: 1.0.0
  title: Sicherheitspass API
  description: |
    (DE) Beschreibt die gegenüber einem ERP angebotenen Schnittstellen auf Seite Suva für den Digitalen Sicherheitspass.
    (EN) Describes the interfaces offered to an ERP system by Suva for the digital safety pass.
  license:
    name: Apache License 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'

servers:
  - url: 'https://apitest.suva.ch/safety-pass'
    description: Staging server
  - url: 'https://api.suva.ch/safety-pass'
    description: Production server

tags:
  - name: Approvals
  - name: Bulk Upload
  - name: Conducting the Instruction
  - name: Identification Cards
  - name: Instructions
  - name: Job Profiles
  - name: Safety Pass

paths:
  /v1/partner/{partnerNr}/sicherheitspaesse/massenupload:
    post:
      description: |
        (DE) Massenupload von Sicherheitspässen. Die Sicherheitspässe werden validiert und - abhängig vom MassenUploadStatusEnumDto - gespeichert.
        (EN) Bulk upload of safety passes. The safety passes are validated and, depending on MassenUploadStatusEnumDto, stored.
      operationId: saveAllSicherheitspaesse
      tags:
        - Bulk Upload
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MassenUploadResultDto'
      responses:
        '200':
          description: |
            (DE) Die Sicherheitspässe wurden erfolgreich validiert und - abhängig vom MassenUploadStatusEnumDto - gespeichert.
            (EN) The safety passes were validated successfully and, depending on MassenUploadStatusEnumDto, stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MassenUploadResultDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/sicherheitspaesse:
    get:
      description: |
        (DE) Listet alle verfügbaren Sicherheitspässe entsprechend den Suchfiltern.
        (EN) Lists all available safety passes according to the search filters.
      operationId: findSicherheitspaesse
      tags:
        - Safety Pass
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: ahvNr
          in: query
          schema:
            type: string
        - name: vorname
          in: query
          schema:
            type: string
        - name: nachname
          in: query
          schema:
            type: string
        - name: geburtsdatum
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: |
            (DE) Listet alle verfügbaren Sicherheitspässe entsprechend den Suchfiltern.
            (EN) Lists all available safety passes according to the search filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SicherheitspassUebersichtListDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/sicherheitspaesse/instruktiondurchfuehrungen:
    post:
      description: |
        (DE) Erstellt Instruktionsdurchführungen für eine Liste von Sicherheitspass-Ids.
        (EN) Creates instruction executions for a list of safety pass IDs.
      operationId: createInstruktionDurchfuehrungen
      tags:
        - Conducting the Instruction
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstruktionDurchfuehrungCreateDto'
      responses:
        '204':
          description: |
            (DE) Instruktionsdurchführung wurde erstellt.
            (EN) Instruction execution was created.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/sicherheitspaesse/{id}:
    get:
      description: |
        (DE) Liefert einen Sicherheitspass.
        (EN) Returns a safety pass.
      operationId: getSicherheitspass
      tags:
        - Safety Pass
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: |
            (DE) Liefert einen Sicherheitspass.
            (EN) Returns a safety pass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SicherheitspassDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/sicherheitspaesse/{sicherheitspassId}/ausweisarten:
    get:
      description: |
        (DE) Liefert eine Liste aller verfügbaren Ausweisarten für einen Sicherheitspass.
        (EN) Returns a list of all available identification card types for a safety pass.
      operationId: findAusweisarten
      tags:
        - Identification Cards
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: |
            (DE) Liefert eine Liste aller verfügbaren Ausweisarten für einen Sicherheitspass.
            (EN) Returns a list of all available identification card types for a safety pass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AusweisartListDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/sicherheitspaesse/{sicherheitspassId}/ausweise:
    get:
      description: |
        (DE) Liefert eine Liste von Ausweisen für einen Sicherheitspass.
        (EN) Returns a list of identification cards for a safety pass.
      operationId: findAusweise
      tags:
        - Identification Cards
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: |
            (DE) Liefert eine Liste von Ausweisen für einen Sicherheitspass.
            (EN) Returns a list of identification cards for a safety pass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AusweisListDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      description: |
        (DE) Erstellt einen Ausweis für einen Sicherheitspass
        (EN) Creates an identification card for a safety pass
      operationId: createAusweis
      tags:
        - Identification Cards
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                dokumente:
                  description: |
                    (DE) Ausweis-Dokumente als Multipart-File, der filename und mimeTyp der Dokumente muss der DokumentMetadataDtoListe entsprechen.
                    (EN) Identification card documents as multipart files, the filename and mimeType of the documents must match the DokumentMetadataDtoList.
                  type: array
                  items:
                    type: string
                    format: binary
                ausweis:
                  $ref: '#/components/schemas/AusweisCreateDto'
              required:
                - ausweis
      responses:
        '200':
          description: |
            (DE) Liefert den erstellten Ausweis
            (EN) Returns the created identification card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AusweisDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/sicherheitspaesse/{sicherheitspassId}/ausweise/{id}:
    get:
      description: |
        (DE) Liefert einen Ausweis.
        (EN) Returns an identification card.
      operationId: getAusweis
      tags:
        - Identification Cards
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: |
            (DE) Liefert einen Ausweis.
            (EN) Returns an identification card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AusweisDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      description: |
        (DE) Löscht einen Ausweis von einem Sicherheitspass
        (EN) Deletes an identification card from a safety pass
      operationId: deleteAusweis
      tags:
        - Identification Cards
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '204':
          description: |
            (DE) Ausweis wurde erfolgreich gelöscht
            (EN) Identification card was successfully deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/sicherheitspaesse/{sicherheitspassId}/ausweise/{ausweisId}/dokumente/{id}:
    get:
      description: |
        (DE) Herunterladen eines Ausweis-Dokumentes.
        (EN) Download an identification card document.
      operationId: getAusweisDokument
      tags:
        - Identification Cards
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: ausweisId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: |
            (DE) Liefert den Dokumentinhalt als Binary-Stream.
            (EN) Returns the document content as a binary stream.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: |
                (DE) Das Format ist `attachment; filename="name.<mimeTypeExt>"`.
                (EN) The format is `attachment; filename="name.<mimeTypeExt>"`.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/sicherheitspaesse/{sicherheitspassId}/profilbild:
    get:
      description: |
        (DE) Herunterladen eines Profilbildes.
        (EN) Download a profile picture.
      operationId: getProfilbild
      tags:
        - Safety Pass
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: |
            (DE) Liefert den Profilbildinhalt als Binary-Stream.
            (EN) Returns the profile picture content as a binary stream.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: |
                (DE) Das Format ist `attachment; filename="name.<mimeTypeExt>"`.
                (EN) The format is `attachment; filename="name.<mimeTypeExt>"`.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/sicherheitspaesse/{sicherheitspassId}/instruktiondurchfuehrungen:
    get:
      description: |
        (DE) Liefert eine Liste von Instruktionsdurchfuehrungen für einen Sicherheitspass.
        (EN) Returns a list of instruction executions for a safety pass.
      operationId: findInstruktionDurchfuehrungen
      tags:
        - Conducting the Instruction
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: Accept-Language
          in: header
          schema:
            type: string
          required: true
          description: |
            (DE) Sprache des Benutzers (DE,FR,IT,PT).
            (EN) User language (DE, FR, IT, PT).
        - name: jobProfilIds
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UUID'
        - name: instruktionDurchfuehrungStatus
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/InstruktionDurchfuehrungStatusEnumDto'
        - name: pageable
          in: query
          style: form
          explode: true
          required: false
          schema:
            $ref: '#/components/schemas/InstruktionDurchfuehrungPageableDto'
      responses:
        '200':
          description: |
            (DE) Liefert eine Liste von Instruktionsdurchfuehrungen für einen Sicherheitspass.
            (EN) Returns a list of instruction executions for a safety pass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstruktionDurchfuehrungPageDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/sicherheitspaesse/{sicherheitspassId}/instruktiondurchfuehrungen/{id}:
    get:
      description: |
        (DE) Liefert eine Instruktiondurchführung.
        (EN) Returns an instruction execution.
      operationId: getInstruktionDurchfuehrung
      tags:
        - Conducting the Instruction
      security:
        - ApiKeyAuth: []
      parameters:
        - name: Accept-Language
          in: header
          schema:
            type: string
          required: true
          description: |
            (DE) Sprache des Benutzers (DE,FR,IT,PT).
            (EN) User language (DE, FR, IT, PT).
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: |
            (DE) Liefert eine Instruktiondurchführung.
            (EN) Returns an instruction execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstruktionDurchfuehrungDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/freigaben:
    get:
      description: |
        (DE) Listet alle verwalteten verfügbaren Sicherheitspässe für einen Betrieb entsprechend den Suchfiltern.
        (EN) Lists all managed available safety passes for a company according to the search filters.
      operationId: findFreigaben
      tags:
        - Approvals
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: suchfeld
          in: query
          schema:
            type: string
        - name: freigabeStatus
          in: query
          schema:
            $ref: '#/components/schemas/FreigabeStatusEnumDto'
        - name: pageable
          in: query
          style: form
          explode: true
          required: false
          schema:
            $ref: '#/components/schemas/FreigabePageableDto'
      responses:
        '200':
          description: |
            (DE) Listet alle verwalteten verfügbaren Sicherheitspässe für einen Betrieb entsprechend den Suchfiltern.
            (EN) Lists all managed available safety passes for a company according to the search filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreigabePageDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      description: |
        (DE) Speichert eine Freigabe fuer einen Sicherheitspass oder Einladung und Betrieb im Status OFFEN.
        (EN) Stores an approval for a safety pass or invitation and company in status OFFEN.
      operationId: createFreigabe
      tags:
        - Approvals
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreigabeCreateDto'
      responses:
        '204':
          description: |
            (DE) Freigabe wurde erfolgreich erstellt.
            (EN) Approval was created successfully.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/freigaben/{id}:
    delete:
      description: |
        (DE) Löscht eine Freigabe für einen Sicherheitspass oder Einladung und Betrieb.
        (EN) Deletes an approval for a safety pass or invitation and company.
      operationId: deleteFreigabe
      tags:
        - Approvals
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '204':
          description: |
            (DE) Freigabe wurde erfolgreich gelöscht.
            (EN) Approval was deleted successfully.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/instruktionen:
    get:
      description: |
        (DE) Liefert eine Liste von Instruktionen.
        (EN) Returns a list of instructions.
      operationId: findInstruktionen
      tags:
        - Instructions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: Accept-Language
          in: header
          schema:
            type: string
          required: true
          description: |
            (DE) Sprache des Benutzers (DE,FR,IT,PT).
            (EN) User language (DE, FR, IT, PT).
        - name: filter
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InstruktionFilterDto'
        - name: pageable
          in: query
          style: form
          explode: true
          required: false
          schema:
            $ref: '#/components/schemas/InstruktionPageableDto'
      responses:
        '200':
          description: |
            (DE) Liefert eine Liste von Instruktionen.
            (EN) Returns a list of instructions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstruktionPageDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      description: |
        (DE) Erstellt eine eigene Instruktion.
        (EN) Creates a custom instruction.
      operationId: createInstruktion
      tags:
        - Instructions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: Accept-Language
          in: header
          schema:
            type: string
          required: true
          description: |
            (DE) Sprache des Benutzers (DE,FR,IT,PT).
            (EN) User language (DE, FR, IT, PT).
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                dokumente:
                  description: |
                    (DE) Instruktion-Dokumente als Multipart-File, der filename und mimeTyp der Dokumente muss der DokumentMetadataDtoListe entsprechen.
                    (EN) Instruction documents as multipart files; filename and mimeType must match the DokumentMetadataDto list.
                  type: array
                  items:
                    type: string
                    format: binary
                instruktion:
                  $ref: '#/components/schemas/InstruktionDto'
              required:
                - instruktion
      responses:
        '204':
          description: |
            (DE) Eigene Instruktion wurde erstellt.
            (EN) Custom instruction was created.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/instruktionen/{id}:
    get:
      description: |
        (DE) Liefert eine Instruktion.
        (EN) Returns an instruction.
      operationId: getInstruktion
      tags:
        - Instructions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: Accept-Language
          in: header
          schema:
            type: string
          required: true
          description: |
            (DE) Alle möglichen Content-Sprachen (InstruktionenSprache).
            (EN) All available content languages (InstruktionenSprache).
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: |
            (DE) Liefert eine Instruktion.
            (EN) Returns an instruction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstruktionDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/instruktionen/{instruktionId}/dokumente/{id}:
    get:
      description: |
        (DE) Herunterladen eines Instruktion-Dokumentes.
        (EN) Download an instruction document.
      operationId: getInstruktionDokument
      tags:
        - Instructions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: instruktionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: |
            (DE) Liefert den Dokumentinhalt als Binary-Stream.
            (EN) Returns the document content as a binary stream.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: |
                (DE) Das Format ist `attachment; filename="name.<mimeTypeExt>"`.
                (EN) The format is `attachment; filename="name.<mimeTypeExt>"`.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/instruktionen/{id}/deaktivieren:
    put:
      description: |
        (DE) Deaktiviert eine eigene Instruktion.
        (EN) Deactivates a custom instruction.
      operationId: deaktiviereInstruktion
      tags:
        - Instructions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: Accept-Language
          in: header
          schema:
            type: string
          required: true
          description: |
            (DE) Sprache des Benutzers (DE,FR,IT,PT).
            (EN) User language (DE, FR, IT, PT).
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: |
            (DE) Instruktion wurde erfolgreich deaktiviert.
            (EN) Instruction was deactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstruktionDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/partner/{partnerNr}/instruktionen/jobprofile:
    get:
      description: |
        (DE) Liefert eine Liste von Jobprofilen.
        (EN) Returns a list of job profiles.
      operationId: getJobProfile
      tags:
        - Job Profiles
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
      responses:
        '200':
          description: |
            (DE) Liefert eine Liste von Jobprofilen.
            (EN) Returns a list of job profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobProfilListDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    ApiKeyAuth:
      description: |
        (DE) Authentifizierung über Bearer-Token
        (EN) Authentication via Bearer Token
      type: http
      scheme: bearer

  schemas:
    BasisDto:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        sequenznummer:
          type: integer
          format: int64
      required:
        - id

    FileMetadataDto:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            filename:
              type: string
              minLength: 1
              maxLength: 255
            mimeType:
              type: string
              maxLength: 200
            filesize:
              type: integer
              format: int64
      required:
        - id
        - filename
        - mimeType

    Error:
      description: |
        (DE) Fehlermeldung
        (EN) Error message
      type: object
      properties:
        httpStatusCode:
          type: integer
        meldungsCode:
          type: string
        meldungsId:
          type: string
          format: uuid
        message:
          type: string
      required:
        - httpStatusCode
        - meldungsCode
        - meldungsId
        - message

    UUID:
      type: string
      format: uuid

    UserId:
      type: string
      maxLength: 36

    MassenUploadResultDto:
      type: object
      properties:
        mitarbeiterList:
          type: array
          items:
            $ref: '#/components/schemas/MassenUploadMitarbeiterDto'
        massenUploadStatus:
          $ref: '#/components/schemas/MassenUploadStatusEnumDto'
      required:
        - mitarbeiterList
        - massenUploadStatus

    MassenUploadStatusEnumDto:
      type: string
      description: >
        * INIT = (DE) Initialzustand, wenn der Client die Massenupload Items an den Server schickt. (EN) initial state when the client sends bulk upload items to the server.
        * ERFOLGREICH = (DE) Alle Massenupload-Items sind fehlerfrei. (EN) all bulk upload items are valid.
        * FEHLER = (DE) Einzelne Massenupload-Items enthalten Fehler. (EN) individual bulk upload items contain errors.
      enum: [ INIT, ERFOLGREICH, FEHLER ]

    MassenUploadMitarbeiterDto:
      type: object
      properties:
        ahvNr:
          $ref: '#/components/schemas/AhvNr'
        vorname:
          type: string # keine Einschränkung da informativ (wird von ZAS geholt)
        nachname:
          type: string # keine Einschränkung da informativ (wird von ZAS geholt)
        geburtsdatum:
          $ref: '#/components/schemas/Geburtsdatum' # optional (wird von ZAS geholt, wird für die Speicherung der Einladung aber gebraucht)
        sprache:
          $ref: '#/components/schemas/SpracheEnumDto'
        kommunikationKanal:
          $ref: '#/components/schemas/KommunikationKanalEnumDto'
        email:
          $ref: '#/components/schemas/Email'
        mobile:
          $ref: '#/components/schemas/Mobile'
        freigabeStatus:
          $ref: '#/components/schemas/FreigabeStatusEnumDto'
        fehlerliste:
          type: array
          items:
            $ref: '#/components/schemas/MassenUploadMitarbeiterFehlerDto'
      required:
        - ahvNr
        - vorname
        - nachname
        - sprache
        - kommunikationKanal
        - fehlerliste

    MassenUploadMitarbeiterFehlerDto:
      type: object
      properties:
        attribut:
          $ref: '#/components/schemas/MassenUploadMitarbeiterAttributEnumDto'
        grund:
          $ref: '#/components/schemas/MassenUploadMitarbeiterFehlerGrundEnumDto'
      required:
        - attribut
        - grund

    MassenUploadMitarbeiterAttributEnumDto:
      type: string
      description: >
        * AHV_NR = (DE) Ahv Nummer des Mitarbeiters. (EN) AHV number of the employee.
        * VORNAME = (DE) Vorname des Mitarbeiters. (EN) First name of the employee.
        * NACHNAME = (DE) Nachname des Mitarbeiters. (EN) Last name of the employee.
        * SPRACHE = (DE) Sprache des Mitarbeiters. (EN) Language of the employee.
        * KOMMUNIKATION_KANAL = (DE) Kommunikationskanal [ EMAIL, MOBILE ]. (EN) Communication channel [ EMAIL, MOBILE ].
        * EMAIL = (DE) Email des Mitarbeiters. (EN) Email of the employee.
        * MOBILE = (DE) Mobiltelefon des Mitarbeiters. (EN) Mobile phone of the employee.
      enum: [ AHV_NR, VORNAME, NACHNAME, SPRACHE, KOMMUNIKATION_KANAL, EMAIL, MOBILE ]

    MassenUploadMitarbeiterFehlerGrundEnumDto:
      type: string
      # VALID ist gültig und wir daher nicht auf die Fehlerliste gesetzt
      # AGE_OVER ist AMA spezifisch und hier ich relevant
      # TOO_MANY_INVALID, THIRD_STRIKE, TEN_LIMIT_LOCK: technische Exceptions vom ZasAdapter welche geworfen und nicht gefangen werden (für Throttling)
      description: >
        * NOT_EXIST = (DE) Die Ahv Nummer existiert nicht. (EN) The AHV number does not exist.
        * INVALID_CHECKSUM = (DE) Die Prüfzimmer der Ahv Nummer ist falsch. (EN) The AHV checksum is invalid.
        * DUBLETTE = (DE) Die Ahv Nummer kommt mehrfach vor. (EN) The AHV number appears multiple times.
        * ALREADY_EXISTS = (DE) Es existiert bereits ein Sicherheitspass mit dieser Ahv Nummer. (EN) A safety pass already exists for this AHV number.
          (SicherheitspassUserIdDuplicateException, SicherheitspassSVNummerDuplicateException, SicherheitspassIdentityDuplicateException(vorname, nachname, geburtsdatum))
        * ANDERE = (DE) Fehler von anderen Attributen als Ahv Nummer (gemäss MassenUploadMitarbeiterAttributEnumDto). (EN) Error from other attributes than AHV number (according to MassenUploadMitarbeiterAttributEnumDto).
      enum: [ NOT_EXIST, INVALID_CHECKSUM, DUBLETTE, ALREADY_EXISTS, ANDERE ]

    MitarbeiterDto:
      allOf:
        - $ref: '#/components/schemas/BasisDto'
        - type: object
          properties:
            ahvNr:
              $ref: '#/components/schemas/AhvNr'
            vorname:
              $ref: '#/components/schemas/Vorname'
            nachname:
              $ref: '#/components/schemas/Nachname'
            geburtsdatum:
              $ref: '#/components/schemas/Geburtsdatum'
            sprache:
              $ref: '#/components/schemas/SpracheEnumDto'
            kommunikationKanal:
              $ref: '#/components/schemas/KommunikationKanalEnumDto'
            email:
              $ref: '#/components/schemas/Email'
            mobile:
              $ref: '#/components/schemas/Mobile'
      required:
        - vorname
        - nachname
        - geburtsdatum
        - sprache
        - kommunikationKanal

    SicherheitspassDto:
      allOf:
        - $ref: '#/components/schemas/MitarbeiterDto'
        - type: object
          properties:
            erstellungsZeitpunkt:
              type: string
              format: 'date-time'
            userId:
              $ref: '#/components/schemas/UserId'
            lesezugriff:
              $ref: '#/components/schemas/LesezugriffDto'
            profilbild:
              $ref: '#/components/schemas/ProfilbildMetadataDto'
            notfallkontakte:
              type: array
              items:
                $ref: '#/components/schemas/NotfallkontaktDto'
      required:
        - notfallkontakte

    InstruktionPageDto:
      type: object
      properties:
        instruktionen:
          type: array
          items:
            $ref: '#/components/schemas/InstruktionUebersichtDto'
        totalElements:
          type: integer
          format: 'int64'
        statistics:
          type: array
          items:
            $ref: '#/components/schemas/StatisticDto'
      required:
        - instruktionen
        - totalElements
        - statistics

    InstruktionDurchfuehrungPageDto:
      type: object
      properties:
        instruktionDurchfuehrungen:
          type: array
          items:
            $ref: '#/components/schemas/InstruktionDurchfuehrungUebersichtDto'
        totalElements:
          type: integer
          format: 'int64'
        statistics:
          type: array
          items:
            $ref: '#/components/schemas/StatisticDto'
      required:
        - instruktionDurchfuehrungen
        - totalElements
        - statistics

    StatisticDto:
      type: object
      description: |
        (DE) Stellt die Anzahl der Datensätze für einen bestimmten Filter dar.
        (EN) Represents the number of records for a specific filter.
      properties:
        name:
          $ref: '#/components/schemas/StatisticNameEnumDto'
        values:
          type: array
          items:
            $ref: '#/components/schemas/StatisticDetailsDto'

    StatisticNameEnumDto:
      type: string
      description: >
        * INSTRUKTION_DURCHFUEHRUNG_STATUS = (DE) Instruktion Durchfuehrung Status. (EN) Instruction execution status.
        * JOB_PROFIL = (DE) Job Profil. (EN) Job profile.
        * INSTRUKTION_OWNER = (DE) Instruktion Owner. (EN) Instruction owner.
      enum: [ INSTRUKTION_DURCHFUEHRUNG_STATUS, JOB_PROFIL, INSTRUKTION_OWNER ]

    StatisticDetailsDto:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
        count:
          type: integer

    InstruktionDurchfuehrungUebersichtDto:
      allOf:
        - $ref: '#/components/schemas/BasisDto'
        - type: object
          properties:
            instruktionTyp:
              $ref: '#/components/schemas/InstruktionTypEnumDto'
            instruktionOwner:
              $ref: '#/components/schemas/InstruktionOwnerEnumDto'
            instruktionIsActive:
              type: boolean
            instruktionSichtbarkeiten:
              type: array
              items:
                $ref: '#/components/schemas/InstruktionSichtbarkeitEnumDto'
            instruktionDurchfuehrungsdauer:
              type: integer
            instruktionContentType:
              type: string
            titel:
              type: string
              maxLength: 100
            status:
              $ref: '#/components/schemas/InstruktionDurchfuehrungStatusEnumDto'
            erledigtAm:
              type: string
              format: 'date'
            gueltigBis:
              type: string
              format: 'date'
          required:
            - instruktionIsActive
            - instruktionSichtbarkeiten

    InstruktionDurchfuehrungCreateDto:
      type: object
      properties:
        sicherheitspassIds:
          description: |
            (DE) Eine Liste von Sicherheitspass-IDs.
            (EN) A list of safety pass IDs.
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        instruktionenIds:
          description: |
            (DE) Eine Liste von Instruktionen-IDs.
            (EN) A list of instruction IDs.
          type: array
          items:
            $ref: '#/components/schemas/UUID'
      required:
        - sicherheitspassIds
        - instruktionenIds

    InstruktionUebersichtDto:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        instruktionTyp:
          $ref: '#/components/schemas/InstruktionTypEnumDto'
        instruktionOwner:
          $ref: '#/components/schemas/InstruktionOwnerEnumDto'
        titel:
          type: string
          maxLength: 100
        status:
          $ref: '#/components/schemas/InstruktionDurchfuehrungStatusEnumDto'
        durchfuehrungsdauer:
          type: integer
        contentType:
          type: string
        sprachen:
          type: array
          items:
            $ref: '#/components/schemas/InstruktionenSpracheEnumDto'

    InstruktionDto:
      allOf:
        - $ref: '#/components/schemas/BasisDto'
        - type: object
          properties:
            instruktionTyp:
              $ref: '#/components/schemas/InstruktionTypEnumDto'
            instruktionOwner:
              $ref: '#/components/schemas/InstruktionOwnerEnumDto'
            titel:
              type: string
              maxLength: 100
            untertitel:
              type: string
            beschreibung:
              type: string
              maxLength: 4000
            startbild:
              $ref: '#/components/schemas/StartbildDto'
            scormFormat:
              $ref: '#/components/schemas/ScormFormatEnumDto'
            scormDateiUrl:
              type: string
            vimeoId:
              type: integer
            gueltigAnzahlMonate:
              type: integer
              minimum: 1
              maximum: 120
            isActive:
              type: boolean
            isTemplate:
              type: boolean
            erstellerUserId:
              type: string
            partnerNr:
              $ref: '#/components/schemas/PartnerNummer'
            durchfuehrungsdauer:
              type: integer
            contentType:
              type: string
            dokumente:
              type: array
              items:
                $ref: '#/components/schemas/DokumentMetadataDto'
            jobProfile:
              type: array
              items:
                $ref: '#/components/schemas/JobProfilDto'
            sprache:
              $ref: '#/components/schemas/InstruktionenSpracheEnumDto'
            sprachen:
              type: array
              items:
                $ref: '#/components/schemas/InstruktionenSpracheEnumDto'
            erfassungssprache:
              $ref: '#/components/schemas/SpracheEnumDto'
      required:
        - titel
        - beschreibung
        - gueltigAnzahlMonate
        - isActive
        - isTemplate

    InstruktionDurchfuehrungDto:
      allOf:
        - $ref: '#/components/schemas/BasisDto'
        - type: object
          properties:
            status:
              $ref: '#/components/schemas/InstruktionDurchfuehrungStatusEnumDto'
            stateData:
              description: |
                (DE) Speichert den Runtime State eines WBT.
                (EN) Stores the runtime state of a web-based training (WBT).
              type: string
            instruktion:
              $ref: '#/components/schemas/InstruktionDto'
      required:
        - status
        - instruktion

    InstruktionFilterDto:
      description: |
        (DE) Filter von Instruktionen.
        (EN) Instruction filters.
      type: object
      properties:
        titel:
          type: string
        instruktionSichtbarkeit:
          $ref: '#/components/schemas/InstruktionSichtbarkeitEnumDto'
        jobProfilIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        instruktionOwner:
          type: array
          items:
            $ref: '#/components/schemas/InstruktionOwnerEnumDto'
      required:
        - instruktionSichtbarkeit
        - jobProfilIds
        - instruktionOwner

    JobProfilDto:
      allOf:
        - $ref: '#/components/schemas/BasisDto'
        - type: object
          properties:
            bezeichnungDe:
              type: string
              maxLength: 100
            bezeichnungFr:
              type: string
              maxLength: 100
            bezeichnungIt:
              type: string
              maxLength: 100
            bezeichnungPt:
              type: string
              maxLength: 100
            isActive:
              type: boolean
      required:
        - bezeichnungDe
        - bezeichnungFr
        - bezeichnungIt
        - bezeichnungPt
        - isActive

    JobProfilListDto:
      type: object
      properties:
        jobProfile:
          type: array
          items:
            $ref: '#/components/schemas/JobProfilDto'
      required:
        - jobProfile

    NotfallkontaktDto:
      allOf:
        - $ref: '#/components/schemas/BasisDto'
        - type: object
          properties:
            vorname:
              $ref: '#/components/schemas/Vorname'
            nachname:
              $ref: '#/components/schemas/Nachname'
            mobile:
              $ref: '#/components/schemas/Mobile'
            beziehung:
              type: string
              maxLength: 50
      required:
        - vorname
        - nachname
        - mobile
        - beziehung

    FreigabePageDto:
      type: object
      properties:
        sicherheitspaesse:
          type: array
          items:
            $ref: '#/components/schemas/SicherheitspassUebersichtDto'
        totalElements:
          type: integer
          format: 'int64'
      required:
        - sicherheitspaesse
        - totalElements

    FreigabeCreateDto:
      type: object
      properties:
        sicherheitspassId:
          $ref: '#/components/schemas/UUID'
        mitarbeiter:
          $ref: '#/components/schemas/MitarbeiterDto'
        partnerNr:
          $ref: '#/components/schemas/PartnerNummer'
      required:
        - partnerNr

    SicherheitspassUebersichtListDto:
      type: object
      properties:
        sicherheitspaesse:
          type: array
          items:
            $ref: '#/components/schemas/SicherheitspassUebersichtDto'
      required:
        - sicherheitspaesse

    SicherheitspassUebersichtDto:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        ahvNr:
          $ref: '#/components/schemas/AhvNr'
        vorname:
          $ref: '#/components/schemas/Vorname'
        nachname:
          $ref: '#/components/schemas/Nachname'
        geburtsdatum:
          $ref: '#/components/schemas/Geburtsdatum'
        freigabeId:
          $ref: '#/components/schemas/UUID'
        freigabeStatus:
          $ref: '#/components/schemas/FreigabeStatusEnumDto'
        istInstruktionenHinzufuegenErlaubt:
          type: boolean
        istFavorit:
          type: boolean

    PartnerNummer:
      description: |
        (DE) ID eines Geschäftspartners.
        (EN) ID of a business partner.
      type: string
      maxLength: 50

    AhvNr:
      description: |
        (DE) Sozialversicherungsnummer.
        (EN) Social security number.
      type: string
      pattern: '^\d{3}\.\d{4}\.\d{4}\.\d{2}$'

    Vorname:
      type: string
      maxLength: 40

    Nachname:
      type: string
      maxLength: 40

    Geburtsdatum:
      type: string
      format: date

    Email:
      type: string
      maxLength: 128

    Mobile:
      type: string
      maxLength: 30

    DokumentMetadataDto:
      allOf:
        - $ref: '#/components/schemas/FileMetadataDto'

    LesezugriffDto:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/UUID'
        zaehler:
          type: integer
      required:
        - code
        - zaehler

    ProfilbildMetadataDto:
      allOf:
        - $ref: '#/components/schemas/FileMetadataDto'

    StartbildDto:
      type: object
      properties:
        xl:
          type: string
        l:
          type: string
        m:
          type: string
        s:
          type: string
        xs:
          type: string
        standard:
          type: string
        fallback:
          type: string
        alt:
          type: string
      required:
        - standard
        - fallback

    InstruktionTypEnumDto:
      type: string
      description: >
        * E_LEARNING = (DE) Typ E-Learning-Instruktion. (EN) E-learning instruction type.
        * TEXT = (DE) Typ Text mit Links-Instruktion. (EN) Text-with-links instruction type.
        * VIDEO = (DE) Typ Video-Instruktion. (EN) Video instruction type.
      enum: [ E_LEARNING, TEXT, VIDEO ]

