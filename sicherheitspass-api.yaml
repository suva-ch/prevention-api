openapi: 3.1.0
info:
  version: 1.0.0
  title: Sicherheitspass API
  description: |
    (DE) Beschreibt die gegenüber einem ERP angebotenen Schnittstellen auf Seite Suva für den Digitalen Sicherheitspass.
    (EN) Describes the interfaces offered to an ERP system by Suva for the digital safety pass.
  license:
    name: Apache License 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'

servers:
  - url: 'https://apitest.suva.ch/safety-pass'
    description: Staging server
  - url: 'https://api.suva.ch/safety-pass'
    description: Production server

tags:
  - name: Approvals
  - name: Bulk Upload
  - name: Conducting the Instruction
  - name: Identification Cards
  - name: Identification Documents
  - name: Instructions
  - name: Instruction Documents
  - name: Job Profiles
  - name: Profile Picture
  - name: Safety Pass

paths:
  /v1/partner/{partnerNr}/sicherheitspaesse/massenupload:
    post:
      operationId: saveAllSicherheitspaesse
      tags:
        - Bulk Upload
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MassenUploadResultDto'
      responses:
        '200':
          description: 'Die Sicherheitspässe wurden erfolgreich validiert und - abhängig vom MassenUploadStatusEnumDto - gespeichert.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MassenUploadResultDto'
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/sicherheitspaesse:
    get:
      operationId: findSicherheitspaesse
      tags:
        - Safety Pass
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: ahvNr
          in: query
          schema:
            type: string
        - name: vorname
          in: query
          schema:
            type: string
        - name: nachname
          in: query
          schema:
            type: string
        - name: geburtsdatum
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 'Listet alle verfügbaren Sicherheitspässe entsprechend den Suchfiltern'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SicherheitspassUebersichtListDto'
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/sicherheitspaesse/instruktiondurchfuehrungen:
    post:
      summary: 'Erstellt Instruktionsdurchführungen für eine Liste von SicherheitspassIds'
      operationId: createInstruktionDurchfuehrungen
      tags:
        - Conducting the Instruction
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstruktionDurchfuehrungCreateDto'
      responses:
        '204':
          description: 'Instruktionsdurchführung wurde erstellt'
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/sicherheitspaesse/{id}:
    get:
      summary: 'Liefert einen Sicherheitspass'
      operationId: getSicherheitspass
      tags:
        - Safety Pass
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: 'Liefert einen Sicherheitspass'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SicherheitspassDto'
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/sicherheitspaesse/{sicherheitspassId}/ausweise:
    get:
      summary: 'Liefert eine Liste von Ausweisen für einen Sicherheitspass'
      operationId: findAusweise
      tags:
        - Identification Cards
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: 'Liefert eine Liste von Ausweisen für einen Sicherheitspass'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AusweisListDto'
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/sicherheitspaesse/{sicherheitspassId}/ausweise/{id}:
    get:
      summary: 'Liefert einen Ausweis'
      operationId: getAusweis
      tags:
        - Identification Cards
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: 'Liefert einen Ausweis'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AusweisDto'
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/sicherheitspaesse/{sicherheitspassId}/ausweise/{ausweisId}/dokumente/{id}:
    get:
      description: 'Herunterladen eines Ausweis-Dokumentes'
      operationId: getAusweisDokument
      tags:
        - Identification Documents
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: ausweisId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: 'Liefert den Dokumentinhalt als Binary-Stream'
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Das Format ist `attachment; filename="name.<mimeTypeExt>"`
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/sicherheitspaesse/{sicherheitspassId}/profilbild:
    get:
      description: 'Herunterladen eines Profilbildes'
      operationId: getProfilbild
      tags:
        - Profile Picture
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: 'Liefert den Profilbildinhalt als Binary-Stream'
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Das Format ist `attachment; filename="name.<mimeTypeExt>"`
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/sicherheitspaesse/{sicherheitspassId}/instruktiondurchfuehrungen:
    get:
      summary: 'Liefert eine Liste von Instruktionsdurchfuehrungen für einen Sicherheitspass'
      operationId: findInstruktionDurchfuehrungen
      tags:
        - Conducting the Instruction
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: Accept-Language
          in: header
          schema:
            type: string
          required: true
          description: Sprache des Benutzers (DE,FR,IT,PT)
        - name: jobProfilIds
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UUID'
        - name: instruktionDurchfuehrungStatus
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/InstruktionDurchfuehrungStatusEnumDto'
        - name: pageable
          in: query
          style: form
          explode: true
          required: false
          schema:
            $ref: '#/components/schemas/InstruktionDurchfuehrungPageableDto'
      responses:
        '200':
          description: 'Liefert eine Liste von Instruktionsdurchfuehrungen für einen Sicherheitspass'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstruktionDurchfuehrungPageDto'
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/sicherheitspaesse/{sicherheitspassId}/instruktiondurchfuehrungen/{id}:
    get:
      summary: 'Liefert eine Instruktiondurchführung'
      operationId: getInstruktionDurchfuehrung
      tags:
        - Conducting the Instruction
      security:
        - ApiKeyAuth: []
      parameters:
        - name: Accept-Language
          in: header
          schema:
            type: string
          required: true
          description: Sprache des Benutzers (DE,FR,IT,PT)
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: sicherheitspassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: 'Liefert eine Instruktiondurchführung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstruktionDurchfuehrungDto'
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/freigaben:
    get:
      operationId: findFreigaben
      tags:
        - Approvals
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: suchfeld
          in: query
          schema:
            type: string
        - name: freigabeStatus
          in: query
          schema:
            $ref: '#/components/schemas/FreigabeStatusEnumDto'
        - name: pageable
          in: query
          style: form
          explode: true
          required: false
          schema:
            $ref: '#/components/schemas/FreigabePageableDto'
      responses:
        '200':
          description: 'Listet alle verwalteten verfügbaren Sicherheitspässe für einen Betrieb entsprechend den Suchfiltern'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreigabePageDto'
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: 'Speichert eine Freigabe fuer einen Sicherheitspass oder Einladung und Betrieb im Status OFFEN'
      operationId: createFreigabe
      tags:
        - Approvals
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreigabeCreateDto'
      responses:
        '204':
          description: 'Freigabe wurde erfolgreich erstellt'
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/freigaben/{id}:
    delete:
      operationId: deleteFreigabe
      tags:
        - Approvals
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '204':
          description: 'Freigabe wurde erfolgreich gelöscht'
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/instruktionen:
    get:
      summary: 'Liefert eine Liste von Instruktionen'
      operationId: findInstruktionen
      tags:
        - Instructions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: Accept-Language
          in: header
          schema:
            type: string
          required: true
          description: Sprache des Benutzers (DE,FR,IT,PT)
        - name: filter
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InstruktionFilterDto'
        - name: pageable
          in: query
          style: form
          explode: true
          required: false
          schema:
            $ref: '#/components/schemas/InstruktionPageableDto'
      responses:
        '200':
          description: 'Liefert eine Liste von Instruktionen'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstruktionPageDto'
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: 'Erstellt eine eigene Instruktion'
      operationId: createInstruktion
      tags:
        - Instructions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: Accept-Language
          in: header
          schema:
            type: string
          required: true
          description: Sprache des Benutzers (DE,FR,IT,PT)
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                dokumente:
                  description: 'Instruktion-Dokumente als Multipart-File, der filename und mimeTyp der Dokumente muss der DokumentMetadataDtoListe entsprechen.'
                  type: array
                  items:
                    type: string
                    format: binary
                instruktion:
                  $ref: '#/components/schemas/InstruktionDto'
              required:
                - instruktion
      responses:
        '204':
          description: 'Eigene Instruktion wurde erstellt'
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/instruktionen/{id}:
    get:
      summary: 'Liefert eine Instruktion'
      operationId: getInstruktion
      tags:
        - Instructions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: Accept-Language
          in: header
          schema:
            type: string
          required: true
          description: Alle möglichen Content-Sprachen (InstruktionenSprache)
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: 'Liefert eine Instruktion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstruktionDto'
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/instruktionen/{instruktionId}/dokumente/{id}:
    get:
      description: 'Herunterladen eines Instruktion-Dokumentes'
      operationId: getInstruktionDokument
      tags:
        - Instruction Documents
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: instruktionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: 'Liefert den Dokumentinhalt als Binary-Stream'
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Das Format ist `attachment; filename="name.<mimeTypeExt>"`
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/instruktionen/{id}/deaktivieren:
    put:
      summary: 'Deaktiviert eine eigene Instruktion'
      operationId: deaktiviereInstruktion
      tags:
        - Instructions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: Accept-Language
          in: header
          schema:
            type: string
          required: true
          description: Sprache des Benutzers (DE,FR,IT,PT)
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: 'Instruktion wurde erfolgreich deaktiviert'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstruktionDto'
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/partner/{partnerNr}/instruktionen/jobprofile:
    get:
      summary: 'Liefert eine Liste von Jobprofilen'
      operationId: getJobProfile
      tags:
        - Job Profiles
      security:
        - ApiKeyAuth: []
      parameters:
        - name: partnerNr
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PartnerNummer'
      responses:
        '200':
          description: 'Liefert eine Liste von Jobprofilen'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobProfilListDto'
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    BasisDto:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        sequenznummer:
          type: integer
          format: int64
      required:
        - id

    FileMetadataDto:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            filename:
              type: string
              minLength: 1
              maxLength: 255
            mimeType:
              type: string
              maxLength: 200
            filesize:
              type: integer
              format: int64
      required:
        - id
        - filename
        - mimeType

    Error:
      description: |
        (DE) Fehlermeldung
        (EN) Error message
      type: object
      properties:
        httpStatusCode:
          type: integer
        meldungsCode:
          type: string
        meldungsId:
          type: string
          format: uuid
        message:
          type: string
      required:
        - httpStatusCode
        - meldungsCode
        - meldungsId
        - message

    UUID:
      type: string
      format: uuid

    UserId:
      type: string
      maxLength: 36

    MassenUploadResultDto:
      type: object
      properties:
        mitarbeiterList:
          type: array
          items:
            $ref: '#/components/schemas/MassenUploadMitarbeiterDto'
        massenUploadStatus:
          $ref: '#/components/schemas/MassenUploadStatusEnumDto'
      required:
        - mitarbeiterList
        - massenUploadStatus

    MassenUploadStatusEnumDto:
      type: string
      description: >
        * INIT = Initialzustand, wenn der Client die Massenupload Items an den Server schickt 
        * ERFOLGREICH = Alle Massenupload-Items sind fehlerfrei
        * FEHLER = Einzelne Massenupload-Items enthalten Fehler
      enum: [ INIT, ERFOLGREICH, FEHLER ]

    MassenUploadMitarbeiterDto:
      type: object
      properties:
        ahvNr:
